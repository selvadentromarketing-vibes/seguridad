# ==============================================================================
# netlify.toml — Landing Seguridad · Selvadentro Tulum
#
# Sitio estático sin paso de build: Netlify publica ./public tal cual.
# Estructura: índice interno en /, una landing por variante A/B en
# /seguridad*/, y assets, video y config.js compartidos en la raíz.
#
# `public/.htaccess` es de Apache y Netlify lo ignora; se conserva por si
# el sitio se sube también a un hosting Apache. Todo lo que hacía está
# traducido aquí abajo (HTTPS y gzip son automáticos en Netlify).
# ==============================================================================

[build]
  publish = "public"

[dev]
  publish = "public"
  framework = "#static"


# ------------------------------------------------------------------------------
# Cabeceras de seguridad para todas las rutas.
#
# Sobre la CSP: las landings llevan su CSS y su JS embebidos en el HTML
# (un bloque <style>, un bloque <script> y ~250 atributos style=), así que
# 'unsafe-inline' es obligatorio en script-src y style-src — sin eso las
# páginas se quedan sin estilos y sin formulario. Aun así la política sigue
# aportando: bloquea scripts de dominios ajenos y limita connect-src al
# webhook del CRM, que es por donde salen los datos de los leads.
#
# connect-src incluye services.leadconnectorhq.com porque ahí hace POST el
# formulario. Si cambias de CRM, hay que cambiarlo aquí también.
# ------------------------------------------------------------------------------
[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https://www.google.com https://www.google.com.mx https://googleads.g.doubleclick.net https://*.google-analytics.com https://*.googletagmanager.com https://www.facebook.com https://*.clarity.ms; media-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.googleadservices.com https://www.google.com https://connect.facebook.net https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://services.leadconnectorhq.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.facebook.com https://*.clarity.ms https://c.bing.com; frame-src https://td.doubleclick.net https://www.googletagmanager.com; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# ------------------------------------------------------------------------------
# La CSP de arriba ya permite Google Analytics 4, Google Ads, el píxel de Meta
# y Microsoft Clarity. Los identificadores se pegan en public/config.js, no
# aquí: cada herramienta se carga sola cuando su campo tiene valor.
#
# Si añades otra herramienta de medición, hay que sumar su dominio aquí o el
# navegador la bloqueará sin avisar (el motivo sale en la consola).
# ------------------------------------------------------------------------------


# ------------------------------------------------------------------------------
# Caché — equivalente a los Expires del .htaccess.
# Fotos y video un año: son archivos grandes y no cambian.
#
# Ojo: si reemplazas una imagen conservando el mismo nombre, quien ya la
# tenga en caché seguirá viendo la vieja. Para forzar la actualización,
# súbela con otro nombre (p. ej. cenote-2.jpg) y cambia la referencia.
# ------------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/video/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000"

# config.js sin caché: es el archivo donde se edita el webhook, el número de
# WhatsApp y los textos, y esos cambios tienen que verse al instante.
[[headers]]
  for = "/config.js"

  [headers.values]
    Cache-Control = "no-cache"
